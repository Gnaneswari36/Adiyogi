<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container-wrapper {
            min-height: 100vh; /* Make the wrapper take up the full viewport height */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background-color: #fdf9f9d0;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        .btn-social {
            margin-top: 10px;
            width: 100%;
            border-radius: 50px;
        }
        .no-decoration {
      text-decoration: none;
      color: inherit; 
  }
    </style>
</head>
<body style="background-color: rgb(4, 2, 48);">

    <nav class="navbar navbar-expand-lg navbar-light sticky-top bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="assets/isha-foundation-logo-0DBD2FDF0D-seeklogo.com.png" alt="Logo" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./index.html"><b>Home</b></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./About.html"><b>About</b></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./Shop.html"><b>Shop</b></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Events.html"><b>Events</b></a>
                    </li>
                </ul>
                <button class="btn btn-outline-danger me-2">
                    <a href="./contact.html" class="no-decoration">Contact</a>
                </button>
                <button class="btn btn-outline-danger me-2">
                    <a href="./login.html" class="no-decoration">Login</a>
                </button>
            </div>
        </div>
    </nav> 
<br>
    <div class="form-container-wrapper">
        <div class="form-container">
            <h3 class="text-center">Sign up</h3>
            <form>
                <div class="mb-3">
                    <label for="firstName" class="form-label"><b>First name</b></label>
                    <input type="text" class="form-control" id="firstName" placeholder="First name">
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label"><b>Last name</b></label>
                    <input type="text" class="form-control" id="lastName" placeholder="Last name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label"><b>Email</b></label>
                    <input type="email" class="form-control" id="email" placeholder="Email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label"><b>Password</b></label>
                    <input type="password" class="form-control" id="password" placeholder="Password">
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label"><b>Confirm Password</b></label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="promotions">
                    <label class="form-check-label" for="promotions">
                        I agree to receive updates and promotions about Agoda and its affiliates or business partners via various channels, including WhatsApp. Opt out anytime. Read more in the Privacy Policy.
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign up</button>
                <p class="text-center my-3">or continue with</p>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-light btn-social">
                        <img src="https://img.icons8.com/color/16/000000/google-logo.png" alt="Google Logo"> Google
                    </button>
                    <button type="button" class="btn btn-light btn-social">
                        <img src="https://img.icons8.com/color/16/000000/facebook.png" alt="Facebook Logo"> Facebook
                    </button>
                    <button type="button" class="btn btn-light btn-social">
                        <img src="https://img.icons8.com/color/16/000000/mac-os.png" alt="Apple Logo"> Apple
                    </button>
                </div>
                <p class="text-center mt-3">
                    Already have an account? <a href="#">Sign in</a>
                </p>
            </form>
            <p class="text-center small text-muted">
                By signing in, I agree to Agoda's <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.
            </p>
        </div>
    </div><br>
    <img src="./assets/adi-1536x77.jpg" class="img-fluid" alt="adi">

  </footer>

</body>
</html>
