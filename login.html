  body {
      background-color: #f4f1e9;

  .login-form {

      width: 100%;

  }
  .login-form .btn-google {
      background-color: white;
      color: black;
      border: 1px solid #ddd;
      width: 100%;
      font-size: 16px;
  }
  .divider {
      margin: 20px 0;
      text-align: center;
      position: relative;
  }
  .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 45%;
      height: 1px;
      background-color: #ddd;
  }
  .divider::before {
      left: 0;
  }
  .divider::after {
      right: 0;
  }
  .divider span {
      padding: 0 10px;
      background: #f4f1e9;
      color: #888;
  }
  .login-form a {
      color: #888;
      text-decoration: none;
  }
</style>

      <div class="login-form">
          <img src="assets/isha-foundation-logo-0DBD2FDF0D-seeklogo.com.png" alt="Logo" style="max-width: 100px;">
